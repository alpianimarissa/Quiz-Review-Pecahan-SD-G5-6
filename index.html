<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Master Pecahan - Kelas 5 Kurikulum Merdeka</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
            min-height: 100vh;
        }
        /* Styling khusus pecahan vertikal */
        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            margin: 0 0.25rem;
            font-size: 1.1em;
            font-weight: 700;
        }
        .frac > span {
            display: block;
        }
        .frac-num {
            border-bottom: 2px solid currentColor;
            padding: 0 4px 2px 4px;
        }
        .frac-den {
            padding: 2px 4px 0 4px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-400 selection:text-slate-900">

    <!-- Compact Header -->
    <header class="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 text-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-2 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🏆</span>
                <div>
                    <h1 class="text-sm md:text-base font-extrabold tracking-wide leading-tight">Kuis Master Pecahan Kelas 5</h1>

                </div>
            </div>
            <div class="flex items-center space-x-3 bg-emerald-950/30 px-3 py-1.5 rounded-lg backdrop-blur-md">

                <button onclick="resetQuiz()" class="text-[10px] bg-rose-500 hover:bg-rose-600 text-white px-2 py-1 rounded font-bold transition">Reset Kuis</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="grid md:grid-cols-4 gap-6">
            
            <!-- Question Card Area (3 cols on md) -->
            <div class="md:col-span-3 space-y-6">
                <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-emerald-100 relative">
                    <!-- Progress & Number -->
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                        <span id="question-badge" class="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs rounded-full">Soal 1 dari 30</span>
                        <span id="category-badge" class="text-xs font-semibold text-slate-500">Operasi Pecahan</span>
                    </div>

                    <!-- Question Text -->
                    <div id="question-text" class="text-base md:text-lg font-bold text-slate-900 mb-6 leading-relaxed">
                        Memuat pertanyaan...
                    </div>

                    <!-- Options Grid -->
                    <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                        <!-- Options generated dynamically -->
                    </div>

                    <!-- Explanation / Rationale Box -->
                    <div id="explanation-box" class="hidden p-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm mb-6">
                        <p class="font-bold mb-1" id="explanation-title"></p>
                        <p class="text-slate-600 text-xs leading-relaxed" id="explanation-text"></p>
                    </div>

                    <!-- Navigation Footer inside Card -->
                    <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                        <button onclick="prevQuestion()" id="btn-prev" class="px-5 py-2 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs hover:bg-slate-100 transition disabled:opacity-50">← Sebelumnya</button>
                        <button onclick="nextQuestion()" id="btn-next" class="px-6 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-lg shadow-emerald-600/30 transition">Selanjutnya →</button>
                    </div>
                </div>
            </div>

            <!-- Question Palette Sidebar (1 col on md) -->
            <div class="space-y-4">
                <div class="bg-white rounded-3xl p-5 shadow-xl border border-emerald-100">
                    <h3 class="font-bold text-sm text-slate-800 mb-3 flex items-center justify-between">
                        <span>Navigasi Soal</span>
                        <span id="answered-count" class="text-xs text-emerald-600">0/30 Terisi</span>
                    </h3>
                    <div class="grid grid-cols-5 gap-2 max-h-[350px] overflow-y-auto p-1" id="palette-grid">
                        <!-- Palette buttons generated dynamically -->
                    </div>
                </div>

                <div class="bg-emerald-800 text-white rounded-3xl p-5 shadow-xl text-xs space-y-2">
                    <p class="font-bold">💡 Tips Belajar:</p>
                    <p class="text-emerald-100 leading-relaxed">Jawabanmu tersimpan otomatis di perangkat ini. Jika tidak sengaja tertutup atau ter-refresh, progresmu aman!</p>
                </div>
            </div>

        </div>
    </main>

            }
        ];

        // State Management with LocalStorage
        let currentIdx = 0;
        let userAnswers = JSON.parse(localStorage.getItem('fraction_quiz_answers')) || {};
        let shuffledOptionsCache = JSON.parse(localStorage.getItem('fraction_quiz_shuffles')) || {};

        function getShuffledOptions(q) {
            if (shuffledOptionsCache[q.id]) {
                return shuffledOptionsCache[q.id];
            }
            let ops = q.options.map((opt, idx) => ({ ...opt, origIndex: idx }));
            for (let i = ops.length - 1; i > 0; i--) {
                let j = (q.id * 17 + i * 31) % (i + 1);
                [ops[i], ops[j]] = [ops[j], ops[i]];
            }
            shuffledOptionsCache[q.id] = ops;
            localStorage.setItem('fraction_quiz_shuffles', JSON.stringify(shuffledOptionsCache));
            return ops;
        }

        function initQuiz() {
            renderPalette();
            loadQuestion(currentIdx);
            updateScoreDisplay();
        }

        function loadQuestion(idx) {
            currentIdx = idx;
            const q = quizData[idx];
            
            document.getElementById('question-badge').innerText = `Soal ${idx + 1} dari 30`;
            document.getElementById('category-badge').innerText = q.category;
            document.getElementById('question-text').innerHTML = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const ops = getShuffledOptions(q);
            const savedAns = userAnswers[q.id];

            ops.forEach((opt, localIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border border-slate-200 bg-white hover:border-emerald-500 hover:bg-emerald-50/50 font-medium transition flex items-center justify-between text-sm md:text-base";
                
                let letter = String.fromCharCode(65 + localIdx); // A, B, C, D
                btn.innerHTML = `<span class="font-bold mr-3 text-emerald-700">${letter}.</span> <span class="flex-1">${opt.text}</span>`;

                if (savedAns !== undefined) {
                    btn.disabled = true;
                    if (opt.origIndex === savedAns.selectedOptIndex) {
                        if (opt.isCorrect) {
                            btn.className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-medium flex items-center justify-between text-sm md:text-base text-emerald-900";
                        } else {
                            btn.className = "w-full text-left p-4 rounded-2xl border-2 border-rose-500 bg-rose-50 font-medium flex items-center justify-between text-sm md:text-base text-rose-900";
                        }
                    } else if (opt.isCorrect) {
                        btn.className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-medium flex items-center justify-between text-sm md:text-base text-emerald-900";
                    }
                } else {
                    btn.onclick = () => selectOption(q.id, opt.origIndex, localIdx);
                }

                optionsContainer.appendChild(btn);
            });

            const expBox = document.getElementById('explanation-box');
            if (savedAns !== undefined) {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-title').innerText = savedAns.isCorrect ? "🎉 Benar!" : "❌ Kurang Tepat!";
                document.getElementById('explanation-title').className = savedAns.isCorrect ? "font-bold mb-1 text-emerald-700" : "font-bold mb-1 text-rose-700";
                const correctOpt = q.options.find(o => o.isCorrect);
                document.getElementById('explanation-text').innerHTML = correctOpt.rationale;
            } else {
                expBox.classList.add('hidden');
            }

            document.getElementById('btn-prev').disabled = idx === 0;
            document.getElementById('btn-next').innerText = idx === quizData.length - 1 ? "Selesai 🏆" : "Selanjutnya →";

            renderPalette();
        }

        function selectOption(qId, origIdx, localIdx) {
            const q = quizData.find(item => item.id === qId);
            const chosenOpt = q.options.find((o, idx) => idx === origIdx);
            const isCorrect = chosenOpt.isCorrect;

            userAnswers[qId] = {
                selectedOptIndex: origIdx,
                isCorrect: isCorrect
            };

            localStorage.setItem('fraction_quiz_answers', JSON.stringify(userAnswers));
            
            loadQuestion(currentIdx);
            updateScoreDisplay();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                loadQuestion(currentIdx + 1);
            } else {
                alert("Selamat! Anda telah menyelesaikan seluruh 30 soal kuis pecahan.");
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                loadQuestion(currentIdx - 1);
            }
        }

        function jumpToQuestion(idx) {
            loadQuestion(idx);
        }

        function renderPalette() {
            const paletteGrid = document.getElementById('palette-grid');
            paletteGrid.innerHTML = '';

            let answeredCount = 0;

            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = "h-9 rounded-xl font-bold text-xs transition flex items-center justify-center border ";
                
                const ans = userAnswers[q.id];
                if (ans !== undefined) {
                    answeredCount++;
                    if (ans.isCorrect) {
                        btn.className += "bg-emerald-500 text-white border-emerald-600 shadow-sm";
                    } else {
                        btn.className += "bg-rose-500 text-white border-rose-600 shadow-sm";
                    }
                } else {
                    btn.className += "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
                }

                if (idx === currentIdx) {
                    btn.className += " ring-2 ring-emerald-600 ring-offset-2";
                }

                btn.innerText = idx + 1;
                btn.onclick = () => jumpToQuestion(idx);
                paletteGrid.appendChild(btn);
            });

            document.getElementById('answered-count').innerText = `${answeredCount}/30 Terisi`;
        }

        function updateScoreDisplay() {
            let score = 0;
            Object.values(userAnswers).forEach(ans => {
                if (ans.isCorrect) score++;
            });
            document.getElementById('score-display').innerText = score;
        }

        function resetQuiz() {
            if (confirm("Apakah Anda yakin ingin mereset seluruh progres kuis?")) {
                localStorage.removeItem('fraction_quiz_answers');
                localStorage.removeItem('fraction_quiz_shuffles');
                userAnswers = {};
                shuffledOptionsCache = {};
                currentIdx = 0;
                initQuiz();
            }
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
